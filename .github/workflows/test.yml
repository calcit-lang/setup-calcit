name: Tests

on:
  push:
    branches:
    - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Test version contract
      run: npm test

    - name: Setup standalone caps without a Calcit release download
      id: setup-caps-only
      uses: ./
      with:
        deps-file: test-fixtures/deps.cirru
        tools: caps

    - name: Setup Calcit from a legacy release
      id: setup
      uses: ./
      with:
        deps-file: test-fixtures/deps.cirru

    - name: Reuse Calcit tools from the runner cache
      id: setup-cached
      uses: ./
      with:
        deps-file: test-fixtures/deps.cirru

    - name: Capture Calcit
      run: |
        test "${{ steps.setup.outputs.version }}" = "0.13.27"
        test "${{ steps.setup.outputs.version-source }}" = "deps-file"
        test "${{ steps.setup.outputs.caps-version }}" = "0.1.0"
        test "${{ steps.setup-caps-only.outputs.tools }}" = "caps"
        test "${{ steps.setup-caps-only.outputs.cache-hit }}" = "false"
        test "${{ steps.setup.outputs.tools }}" = "cr,caps"
        test "${{ steps.setup.outputs.cache-hit }}" = "false"
        test "${{ steps.setup-cached.outputs.cache-hit }}" = "true"
        calcit --help
        caps --help
        test "$(caps --version)" = "caps 0.1.0"
        cr eval "range 100"
