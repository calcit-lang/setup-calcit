name: Tests

on:
  push:
    branches:
    - main
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Test version contract
      run: npm test

    - name: Setup Calcit from deps.cirru
      id: setup
      uses: ./
      with:
        deps-file: test-fixtures/deps.cirru

    - name: Capture Calcit
      run: |
        test "${{ steps.setup.outputs.version }}" = "0.13.27"
        test "${{ steps.setup.outputs.version-source }}" = "deps-file"
        test "${{ steps.setup.outputs.tools }}" = "cr,caps"
        cr --help
        caps --help
        cr eval "range 100"
