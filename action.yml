
name: setup-calcit
description: Set up Calcit tools from the project declaration
inputs:
  version:
    description: "Fallback Calcit version for a task without deps.cirru; must match deps.cirru when both are provided"
    required: false
  deps-file:
    description: "Path to the project deps.cirru, relative to the GitHub workspace"
    required: false
  caps-version:
    description: "Independent calcit-caps release installed from crates.io when caps is requested"
    required: false
    default: "0.1.0"
  cr-wasm:
    description: "Compatibility input that additionally installs cr-wasm"
    required: false
    default: false
  tools:
    description: "Comma-separated tools to install: calcit,caps,cr-wasm (cr is a compatibility alias for calcit)"
    required: false
    default: "cr,caps"
outputs:
  version:
    description: "Resolved Calcit version"
  version-source:
    description: "Whether the version came from deps-file or input"
  caps-version:
    description: "Resolved independent calcit-caps version"
  deps-file:
    description: "Project-relative deps file that was inspected"
  tools:
    description: "Comma-separated requested tools; the legacy cr spelling is preserved for v1 compatibility"
  cache-hit:
    description: "Whether every requested tool was restored from the runner tool cache"

runs:
  using: node24
  main: dist/index.js

branding:
  icon: cloud-snow
  color: blue
